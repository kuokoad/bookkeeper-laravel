          - navigation "Pagination" [ref=f7e608]:
            - paragraph [ref=f7e609]: Showing 1–36 of 36 movements
        - paragraph [ref=f7e610]: This ledger is the source of truth for stock. Movements are listed in the order they were entered, newest first, so a backdated entry appears where it was recorded, under the date the stock moved. The balance shown on each row is the position immediately after that movement, so any figure on the Products page can be traced back to the exact line that produced it. Filtering changes what you see, never what the shop holds.