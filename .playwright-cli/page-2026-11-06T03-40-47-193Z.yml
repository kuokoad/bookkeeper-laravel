            - listitem [ref=f21e484]: Stock. Valued at weighted average cost. Cost of goods sold is the cost recorded at the time of each sale, not a recalculation at the year end.
            - listitem [ref=f21e485]: Credit sales and purchases. Recorded when the sale or purchase happens, not when the money moves. Amounts still outstanding appear as owed by customers and owed to suppliers.
            - listitem [ref=f21e486]: No closing entries. Revenue and expense accounts are not zeroed at the year end. All-time profit is carried within the owner's stake, which is why the Trial Balance above shows cumulative figures while the Profit and Loss covers this year only. The Movement in the Owner's Stake reconciles the two.
            - listitem [ref=f21e487]: Corrections. Nothing already recorded is edited or deleted. A correction is posted as a dated reversing entry, so the original and its reversal both remain visible.
